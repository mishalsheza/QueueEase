# Render Blueprint for the QueueEase API. Setup steps and the env var
# checklist: docs/deploy-render.md.
#
# No secrets in this file: MONGO_URI and CORS_ORIGINS are asked for when the
# Blueprint is created, and JWT_SECRET is generated by Render.
services:
  - type: web
    name: queueease-api
    runtime: node
    rootDir: backend # only changes under backend/ trigger a deploy
    # Pick the region closest to your Atlas cluster. It can't be changed later.
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    # 200 only while MongoDB is connected; Render won't switch traffic to a
    # deploy that fails it.
    healthCheckPath: /api/health
    # Deploy a commit only after its GitHub checks (the CI workflow) pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Atlas connection string; the app always uses the "queueease" database.
      - key: MONGO_URI
        sync: false
      # Random base64 256-bit value (44 characters), generated once.
      - key: JWT_SECRET
        generateValue: true
      # Browser origins allowed to call the API. Native apps don't need one.
      - key: CORS_ORIGINS
        sync: false
      # Render sits in front of the app as a reverse proxy; verify after the
      # first deploy (docs/deploy-render.md, "Check TRUST_PROXY").
      - key: TRUST_PROXY
        value: "1"
      # PORT is set by Render; the server reads it.
