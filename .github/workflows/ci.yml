name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # mongodb-memory-server downloads a mongod binary on first use; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      # The tests use an in-memory MongoDB and tests/setupEnv.js; no secrets or backend/.env needed.
      - run: npm test

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # --wait returns once both containers pass their health checks
      # (the API's needs MongoDB connected), and fails if they don't.
      - name: Start the API and MongoDB
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health check from the host
        run: curl -fsS http://localhost:5001/api/health
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop and remove
        if: always()
        run: docker compose down -v

  mobile:
    name: Mobile type-check, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
